<!-- =====================================================================
  ВРАЩАЮЩАЯСЯ ВИЛЛА — HTML-элемент для Zero Block (Тильда)
  Вставить целиком в элемент «HTML» внутри Zero Block.
  Ссылка на модель уже вставлена.
===================================================================== -->

<script type="module" src="https://cdn.jsdelivr.net/npm/@google/model-viewer@3.5.0/dist/model-viewer.min.js"></script>

<style>
  /* Модель занимает весь HTML-элемент и «не ловит» мышь/тач:
     курсор проходит сквозь, кнопки и текст рядом кликаются свободно */
  #villa-hero{
    position:absolute; inset:0; width:100%; height:100%;
    background:transparent; --poster-color:transparent;
    pointer-events:none;
    opacity:0; transition:opacity .9s ease;   /* плавное появление после загрузки */
  }
  #villa-hero.is-ready{ opacity:1; }
  /* Если HTML-слой лежит НАД кнопками, этот пункт тоже отдаёт клики вниз */
  .t396__elem:has(#villa-hero), .tn-atom:has(#villa-hero){ pointer-events:none !important; }
</style>

<model-viewer
  id="villa-hero"
  src="https://cdn.jsdelivr.net/gh/danadanon3/villaS-3d@main/villa-S-opt.glb"
  alt="Villa — Domaine d'Eole"

  auto-rotate
  auto-rotate-delay="0"
  rotation-per-second="12deg"

  camera-orbit="35deg 42deg 80%"
  field-of-view="30deg"
  interaction-prompt="none"
  disable-zoom disable-pan disable-tap

  environment-image="neutral"
  exposure="0.95"
  shadow-intensity="1.1"
  shadow-softness="1"

  loading="eager"
  poster=""
  reveal="auto">
</model-viewer>

<script>
(function () {
  var mv = document.getElementById('villa-hero');
  if (!mv) return;

  /* ---------- НАСТРОЙКИ, КОТОРЫЕ МОЖНО КРУТИТЬ ----------
     TINT  — оттенок стен [R, G, B, 1], 1 = без изменений.
             Теплее/темнее: [1, 0.94, 0.86, 1]. Белее: [1, 0.98, 0.95, 1].
     Размер в кадре — число в camera-orbit выше (120% → 100% крупнее, 140% мельче). */
  var TINT = [1, 0.95, 0.89, 1];

  mv.addEventListener('load', function () {
    var model = mv.model;
    if (model && model.materials) {
      model.materials.forEach(function (mat) {
        /* убирает «прозрачные дыры» от полупрозрачных материалов */
        try { mat.setAlphaMode('OPAQUE'); } catch (e) {}
        /* показывает внутреннюю сторону стен, если у сетки нет задних граней */
        try { mat.setDoubleSided(true); } catch (e) {}
        /* тёплый кремово-штукатурный оттенок вместо ослепительно-белого, матовость */
        try {
          mat.pbrMetallicRoughness.setBaseColorFactor(TINT);
          mat.pbrMetallicRoughness.setMetallicFactor(0);
          mat.pbrMetallicRoughness.setRoughnessFactor(0.9);
        } catch (e) {}
      });
    }
    mv.classList.add('is-ready');
  });

  /* на телефоне отдаляем камеру, чтобы вытянутая вилла не обрезалась по краям */
  if (window.matchMedia('(max-width: 640px)').matches) {
    mv.setAttribute('camera-orbit', '35deg 46deg 100%');
  }
})();
</script>
