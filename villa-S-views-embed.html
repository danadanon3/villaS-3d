<!-- ======================================================================
  DOMAINE D'EOLE — 3D-ВИДЫ ВИЛЛЫ (официальные рендеры Studio KO, 4 ракурса)
  HTML-элемент для Zero Block. Заменяет старую 3D-модель.

  НАСТРОЙКИ — в начале скрипта ниже:
    BASE   — папка с картинками на GitHub (через jsDelivr)
    VILLA  — 'villa-m' или 'villa-s'
    SPEED  — сколько секунд показывается один ракурс
====================================================================== -->
<style>
  .dde-views{
    position:absolute; inset:0; overflow:hidden; user-select:none; -webkit-user-select:none;
    cursor:grab; touch-action:pan-y;
  }
  .dde-views.is-drag{cursor:grabbing}
  .dde-views__img{
    position:absolute; inset:0; width:100%; height:100%; object-fit:contain;
    opacity:0; transition:opacity 1.1s ease; pointer-events:none;
  }
  /* Рендеры показываются как есть, без изменения цвета.
     Если захотите, чтобы фон рендера растворялся в фоне сайта,
     допишите класс dde-views--blend к <div class="dde-views ..."> */
  .dde-views--blend .dde-views__img{
    mix-blend-mode:multiply;
    -webkit-mask-image:radial-gradient(ellipse 50% 50% at 50% 50%, #000 60%, transparent 100%);
            mask-image:radial-gradient(ellipse 50% 50% at 50% 50%, #000 60%, transparent 100%);
  }
  .dde-views__img.is-on{opacity:1}
  .dde-views__ui{
    position:absolute; left:50%; bottom:4%; transform:translateX(-50%);
    display:flex; align-items:center; gap:18px; z-index:2;
    font:400 12px/1 var(--t-text-font, Arial), sans-serif; letter-spacing:.14em; color:#4A3022;
  }
  .dde-views__btn{
    width:34px; height:34px; border:1px solid rgba(74,48,34,.35); border-radius:50%;
    background:rgba(243,238,231,.55); color:#4A3022; cursor:pointer; padding:0;
    display:flex; align-items:center; justify-content:center; transition:background .25s,border-color .25s;
  }
  .dde-views__btn:hover{background:#4A3022; color:#F3EEE7; border-color:#4A3022}
  .dde-views__btn svg{width:14px; height:14px}
  .dde-views__count{min-width:54px; text-align:center}
  @media (max-width:640px){
    .dde-views__ui{bottom:1%; gap:12px; font-size:11px}
    .dde-views__btn{width:28px; height:28px}
  }
</style>

<div class="dde-views" aria-roledescription="carousel" aria-label="Vues 3D de la villa">
  <div class="dde-views__ui">
    <button class="dde-views__btn" data-dir="-1" aria-label="Previous view">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M15 5l-7 7 7 7"/></svg>
    </button>
    <span class="dde-views__count">01 / 04</span>
    <button class="dde-views__btn" data-dir="1" aria-label="Next view">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M9 5l7 7-7 7"/></svg>
    </button>
  </div>
</div>

<script>
(function () {
  /* ===== НАСТРОЙКИ ===== */
  var BASE  = 'https://cdn.jsdelivr.net/gh/danadanon3/villaS-3d@main/';
  var VILLA = 'villa-s';
  var SPEED = 3.5;             /* секунд на один ракурс */
  var N     = 4;

  var scripts = document.getElementsByTagName('script');
  var me = scripts[scripts.length - 1];
  var box = me.previousElementSibling;
  while (box && !(box.classList && box.classList.contains('dde-views'))) box = box.previousElementSibling;
  if (!box) box = document.querySelector('.dde-views:not([data-ready])');
  if (!box) return;
  box.setAttribute('data-ready', '1');

  var mobile = window.matchMedia('(max-width: 640px)').matches;
  var imgs = [], cur = 0, timer = null, visible = false, hover = false;

  for (var i = 0; i < N; i++) {
    var im = new Image();
    im.className = 'dde-views__img' + (i === 0 ? ' is-on' : '');
    im.alt = VILLA.replace('villa-', 'Villa ').toUpperCase() + ' — 3D view ' + (i + 1);
    im.decoding = 'async';
    im.loading = i === 0 ? 'eager' : 'lazy';
    im.draggable = false;
    im.src = BASE + VILLA + '-' + (i + 1) + (mobile ? '-mobile' : '') + '.webp';
    box.insertBefore(im, box.querySelector('.dde-views__ui'));
    imgs.push(im);
  }
  var count = box.querySelector('.dde-views__count');

  function show(n) {
    cur = (n + N) % N;
    imgs.forEach(function (im, k) { im.classList.toggle('is-on', k === cur); });
    count.textContent = ('0' + (cur + 1)).slice(-2) + ' / ' + ('0' + N).slice(-2);
  }
  function stop() { clearInterval(timer); timer = null; }
  function play() {
    stop();
    if (visible && !hover) timer = setInterval(function () { show(cur + 1); }, SPEED * 1000);
  }

  box.querySelectorAll('.dde-views__btn').forEach(function (b) {
    b.addEventListener('click', function (e) {
      e.stopPropagation(); show(cur + (+b.getAttribute('data-dir'))); play();
    });
  });

  /* перетаскивание мышью / свайп пальцем — меняет ракурс */
  var x0 = null;
  box.addEventListener('pointerdown', function (e) {
    if (e.target.closest('.dde-views__btn')) return;
    x0 = e.clientX; box.classList.add('is-drag');
  });
  window.addEventListener('pointerup', function (e) {
    if (x0 === null) return;
    var dx = e.clientX - x0; x0 = null; box.classList.remove('is-drag');
    if (Math.abs(dx) > 30) { show(cur + (dx < 0 ? 1 : -1)); play(); }
  });

  box.addEventListener('mouseenter', function () { hover = true; stop(); });
  box.addEventListener('mouseleave', function () { hover = false; play(); });

  if ('IntersectionObserver' in window) {
    new IntersectionObserver(function (en) { visible = en[0].isIntersecting; play(); }, { threshold: 0.3 }).observe(box);
  } else { visible = true; play(); }
})();
</script>
